name: Build

on:
  push:
    branches:
      - Custom
    paths-ignore:
      - '**/Readme.md'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build:

    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          show-progress: false

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pdm install

      - name: Check formatting, lint, types, and tests
        run: pdm run check

      - name: Build release
        run: |
          pdm run build-win

      - name: Smoke test release
        run: |
          $process = Start-Process -FilePath build/exe.win-amd64-3.12/TheWitcher3ModManager.exe -ArgumentList '--version' -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw "Release startup timed out"
          }
          if ($process.ExitCode -ne 0) { throw "Release startup failed: $($process.ExitCode)" }

      - name: Pack release
        run: |
          $nested = Get-ChildItem build/exe.win-amd64-3.12 -Recurse -File |
            Where-Object { $_.Extension -in '.zip', '.7z', '.rar' }
          if ($nested) { throw "Nested archives in release: $($nested.FullName -join ', ')" }
          Compress-Archive -Path build/exe.win-amd64-3.12/* -Destination TW3MM.zip

      - name: Upload release
        uses: Systemcluster/actions@release-github-v0
        with:
          tag: snapshot
          name: Snapshot
          prerelease: true
          files: |
            TW3MM.zip
