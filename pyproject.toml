[project]
name = "TW3MM"
version = "0.10.3"
description = "Mod Manager for The Witcher 3"
authors = [
    { name = "Stefan Kostic", email = "stekos@live.com" },
    { name = "Christian Sdunek", email = "me@systemcluster.me" },
    { name = "Adam Sunderman", email = "amsunderman@gmail.com" },
    { name = "Henry Hsieh", email = "r901042004@yahoo.com.tw" },
    { name = "George Burduli", email = "burduli01@pm.me" },
]
dependencies = [
    "fasteners",
    "pyside6",
    "watchdog",
    "charset-normalizer",
    "pywin32; sys_platform == 'win32'",
    "colorama; sys_platform == 'win32'",
    "patool; sys_platform != 'win32'",
    "easyprocess; sys_platform != 'win32'",
    "patchelf; sys_platform != 'win32' and sys_platform != 'darwin'",
]
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.10,<3.13"

[project.urls]
Repository = "https://github.com/Systemcluster/The-Witcher-3-Mod-manager.git"
NexusMods = "https://www.nexusmods.com/witcher3/mods/2678"

[tool.pdm]
distribution = false

[dependency-groups]
dev = ["ruff==0.16.9", "mypy", "pyright", "cx-freeze", "lief"]

[tool.pdm.scripts]
start = "python -m main"
build-win = "python setup.py build_exe"
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "mypy ."
typecheck-pyright = "pyright"
test = "python -m unittest discover -s tests -v"
check = { composite = [
    "format-check",
    "lint",
    "typecheck-pyright",
    "typecheck",
    "test",
] }

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"src/core/installer.py" = ["E722"]
"src/core/model.py" = ["E722"]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
show_column_numbers = true
exclude = ['(^|/)(build|dist|env|venv|\.venv)/']

[tool.pyright]
include = ["src", "tests", "main.py", "setup.py", "ts.py"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

# Add this block to force source-only installation:
[tool.pdm.resolution]
no-binary = ["charset-normalizer"]
